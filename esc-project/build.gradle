plugins {
	id("java") // Java 플러그인 적용
	id("org.springframework.boot") version "3.4.5" apply false // Spring Boot 플러그인
	id("io.spring.dependency-management") version "1.1.7" apply false // Spring Dependency Management
}

repositories {
	mavenCentral()
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(23)) // Java 23 설정
	}
}


subprojects {
	group = "jo.jung"

	// 서브모듈에 대한 플러그인 적용
	plugins.apply("java") // 적용 방식 변경: `apply(plugin = "java")` -> `plugins.apply("java")`
	plugins.apply ('org.springframework.boot')
	plugins.apply ('io.spring.dependency-management')
	java {
		toolchain {
			languageVersion.set(JavaLanguageVersion.of(23))
		}
	}

	configurations {
		compileOnly {
			extendsFrom annotationProcessor
		}
	}

	repositories {
		mavenCentral()
	}

	test {
		useJUnitPlatform()
	}
	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		implementation("org.springframework.boot:spring-boot-starter-webflux")
		implementation 'com.googlecode.json-simple:json-simple:1.1.1'
		testImplementation("org.springframework.boot:spring-boot-devtools") // spring-boot-devtools 의존성
		testImplementation("org.springframework.boot:spring-boot-starter-test") // 테스트 의존성
		testImplementation("io.projectreactor:reactor-test") // Reactor 테스트 의존성
		testImplementation("org.junit.platform:junit-platform-launcher") // JUnit 런처 의존성
	}

}




project(":domain") {

	dependencies {

	}
}

project(":common") {

	dependencies {
		implementation(project(":domain"))
		implementation 'io.projectreactor.kafka:reactor-kafka:1.3.18'
	}
}

project(":module-db") {

	dependencies {
		implementation(project(":domain"))
		implementation("org.springframework.boot:spring-boot-starter-data-r2dbc")
		implementation("org.springframework.boot:spring-boot-starter-data-redis")

		// MySQL (운영용)
		implementation 'io.asyncer:r2dbc-mysql:1.0.4'
		runtimeOnly 'dev.miku:r2dbc-mysql:0.8.2.RELEASE'
		runtimeOnly 'mysql:mysql-connector-java:8.0.33'
	}
}

project(":module-adm") {

	dependencies {
		implementation(project(":domain"))
		implementation("org.springframework.boot:spring-boot-starter-thymeleaf")
	}
}

project(":module-client") {

	dependencies {
		implementation(project(":domain"))
		implementation(project(":common"))
		implementation("org.springframework.boot:spring-boot-starter-thymeleaf")
	}
}

// logic 모듈
project(":logic") {
	dependencies {
		implementation(project(":domain"))
		implementation(project(":common"))

	}
}

